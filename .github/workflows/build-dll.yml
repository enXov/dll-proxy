name: Build DLL Proxy

on:
  workflow_dispatch:
    inputs:
      dll_type:
        description: 'System DLL file name to proxy (e.g. version.dll, winmm.dll)'
        required: true
        type: string
        default: 'version.dll'
      proxy_method:
        description: 'Export forwarding method'
        required: true
        type: choice
        options:
          - linker
          - runtime
        default: 'linker'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure CMake (installs pefile if needed; extracts exports from system files)
        shell: pwsh
        env:
          DLL_TYPE_NAME: ${{ inputs.dll_type }}
          PROXY_METHOD_NAME: ${{ inputs.proxy_method }}
        run: cmake -B build "-DDLL_TYPE=$env:DLL_TYPE_NAME" "-DPROXY_METHOD=$env:PROXY_METHOD_NAME"
      
      - name: Build DLL (Release)
        run: cmake --build build --config Release
      
      - name: Upload Artifact (proxy DLL)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dll_type }}-${{ inputs.proxy_method }}
          path: build/Release/*.dll
          if-no-files-found: error
